tags:
  - Users

get:
  summary: Retrieve a single user by ID
  operationId: getUserById

  produces:
    - application/json

  security:
    - BearerAuth: []

  parameters:
    - name: user_id
      in: path
      description: ID of the user to retrieve
      required: true
      type: integer
      format: int64
      example: 1

responses:
    "200":
      description: User details
      schema:
        type: object
        properties:
          user:
            type: object
            properties:
              id:
                type: integer
                example: 1
              firstname:
                type: string
                example: "Jane"
              lastname:
                type: string
                example: "Doe"
              email:
                type: string
                example: "jane.doe@example.com"
              role:
                type: string
                example: "teacher"
              is_active:
                type: boolean
                example: true
    "401":
      description: Unauthorized
    "403":
      description: Forbidden - permission denied
    "404":
      description: User not found