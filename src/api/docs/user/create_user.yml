tags:
  - Users

post:
  summary: Create a new user
  operationId: createUser

  consumes:
    - application/json
  produces:
    - application/json

  security:
    - BearerAuth: []

  parameters:
    - in: body
      name: body
      description: User payload
      required: true
      schema:
        type: object
        required:
          - firstname
          - lastname
          - email
          - password
          - role
        properties:
          firstname:
            type: string
            example: "Jane"
          lastname:
            type: string
            example: "Doe"
          email:
            type: string
            format: email
            example: "jane.doe@example.com"
          password:
            type: string
            example: "StrongPass123!"
          role:
            type: string
            example: "teacher"
          admin_id:
            type: integer
            example: 1
      example:
        firstname: "Jane"
        lastname: "Doe"
        email: "jane.doe@example.com"
        password: "StrongPass123!"
        role: "teacher"

responses:
    "201":
      description: User created successfully
      schema:
        type: object
        properties:
          user:
            type: object
    "400":
      description: Bad request - validation failed
    "401":
      description: Unauthorized
    "403":
      description: Forbidden - permission denied