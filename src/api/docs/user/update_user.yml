tags:
  - Users

patch:
  summary: Update a user
  operationId: updateUser

  consumes:
    - application/json
  produces:
    - application/json

  security:
    - BearerAuth: []

  parameters:
    - name: user_id
      in: path
      description: ID of the user to update
      required: true
      type: integer
      format: int64
      example: 1
    - in: body
      name: body
      description: Fields to update (partial)
      required: true
      schema:
        type: object
        properties:
          firstname:
            type: string
            example: "Janet"
          lastname:
            type: string
            example: "Doe"
          email:
            type: string
            format: email
            example: "janet.doe@example.com"
          role:
            type: string
            example: "admin"
          is_active:
            type: boolean
            example: true
      example:
        firstname: "Janet"
        role: "admin"
        is_active: true

responses:
    "200":
      description: User updated successfully
      schema:
        type: object
        properties:
          user:
            type: object
    "400":
      description: Bad request - invalid input
    "401":
      description: Unauthorized
    "403":
      description: Forbidden - permission denied
    "404":
      description: User not found