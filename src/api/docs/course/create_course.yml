tags:
  - Courses

post:
  summary: Create a new course
  operationId: createCourse

  # Swagger 2.0 style (Flasgger) - use parameters/in: body for Try it out to accept JSON payload
  consumes:
    - application/json
  produces:
    - application/json

  # Match securityDefinitions name in src/api/utils/swag_tool.py ("BearerAuth")
  security:
    - BearerAuth: []

  parameters:
    - in: body
      name: body
      description: Course payload
      required: true
      schema:
        type: object
        required:
          - course_title
          - course_code
          - passing_grade
        properties:
          course_title:
            type: string
            example: "Mathematics"
          course_code:
            type: string
            example: "MTH101"
          passing_grade:
            type: integer
            example: 50

responses:
    "201":
      description: Course created successfully
      schema:
        type: object
        properties:
          course:
            type: object
            properties:
              id:
                type: integer
                example: 1
              course_title:
                type: string
                example: "Mathematics"
              course_code:
                type: string
                example: "MTH101"
              passing_grade:
                type: integer
                example: 50
    "401":
      description: Unauthorized
    "422":
      description: Validation error